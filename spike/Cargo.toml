# ⚠️ THROWAWAY Phase 1 spike workspace — measurements only, never shipped, never merged to main.
# Results go to docs/perf.md and docs/adr/. See PROJECT_BRIEF.md §12 (Phase 1).
[workspace]
resolver = "3"
members = ["s1-renderers", "s2-video-gl", "s3-video-wid", "s4-video-sw"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "accessibility",
] }
slint-build = "1.18.1"
libmpv2 = "6.0.0"
libmpv2-sys = "4.0.1"
glow = "0.18.0"
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Same rules as the main workspace, except `unsafe_code` is allowed (FFI and GL interop
# experiments need it; every block still gets a `// SAFETY:` comment).
[workspace.lints.rust]
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
indexing_slicing = "deny"
as_conversions = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
