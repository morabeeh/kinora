# cargo-about configuration — generates THIRD_PARTY_NOTICES.md (`cargo xtask licenses`).
# Keep `accepted` in sync with the allow-list in deny.toml.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }
