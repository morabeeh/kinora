[package]
name = "kinora_app"
description = "Kinora — a fast, private photo and video viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "kinora"

[[bin]]
name = "kinora"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
slint = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# GPU renderer per OS (ADR 0004); the software renderer comes from the workspace entry.
# Windows: Skia (FemtoVG stuttered on Intel's OpenGL driver). Linux: FemtoVG, provisional
# until the Mint PC measurements. macOS: unchanged until v1.1.
[target.'cfg(windows)'.dependencies]
slint = { workspace = true, features = ["renderer-skia"] }

[target.'cfg(not(windows))'.dependencies]
slint = { workspace = true, features = ["renderer-femtovg"] }

[build-dependencies]
slint-build = { workspace = true }

[lints]
workspace = true
