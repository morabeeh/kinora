[package]
name = "kinora_decode"
description = "Image format sniffing and decoding for Kinora."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["heif"]
# HEIC/HEIF through the system's libheif (LGPL, dynamically linked — brief §7.2, §9.5).
heif = ["dep:libheif-rs"]

[dependencies]
kinora_core = { workspace = true }
avif-decode = { workspace = true }
fast_image_resize = { workspace = true }
image = { workspace = true }
jpeg-decoder = { workspace = true }
jxl-oxide = { workspace = true }
kamadak-exif = { workspace = true }
libheif-rs = { workspace = true, optional = true }
moxcms = { workspace = true }
resvg = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
