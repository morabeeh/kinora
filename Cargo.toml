[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
# The fixture generator is a separate, never-shipped tool with its own lockfile (it needs
# libheif's x265 encoder and FFmpeg, which CI does not have). See test_data/README.md.
exclude = ["test_data/generator"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/morabeeh/kinora"
publish = false

# Every external dependency is pinned here once; member crates use `dep = { workspace = true }`.
# Before adding one: check crates.io for version, maintenance and license (see CLAUDE.md).
[workspace.dependencies]
# Internal crates
kinora_core = { path = "crates/kinora_core" }
kinora_decode = { path = "crates/kinora_decode" }
kinora_cache = { path = "crates/kinora_cache" }
kinora_video = { path = "crates/kinora_video" }
kinora_edit = { path = "crates/kinora_edit" }
kinora_platform = { path = "crates/kinora_platform" }

# UI — used under its GPL-3.0 option. No Qt backend. The software (CPU) renderer is always
# compiled in; the GPU renderer is added per OS in kinora_app/Cargo.toml (ADR 0004).
# Pinned exactly (`=`) because `unstable-winit-030` (file drops, window focus) is not
# covered by Slint's semver promise.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
    "raw-window-handle-06",
] }
slint-build = "=1.18.1"

# Errors & logging
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"

# Image decoding (ADR 0005). `image` without its `avif` feature (that one only encodes) and
# without `rayon`, so decode threads stay under the worker budget from the hardware profile.
image = { version = "0.25.10", default-features = false, features = [
    "jpeg", "png", "gif", "webp", "tiff", "bmp", "ico", "tga", "pnm", "qoi", "dds", "hdr", "exr",
] }
jpeg-decoder = { version = "0.3.2", default-features = false } # DCT-scaled JPEG; no rayon
avif-decode = { version = "3.0.0", default-features = false } # AVIF via rav1d (needs NASM)
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"] } # Mint 22 ships 1.17
jxl-oxide = "0.12.6"
resvg = "0.48.1"
fast_image_resize = "6.1.0"
moxcms = "0.8.1" # same version `image` uses, so it is compiled once
kamadak-exif = "0.6.1"

# Settings, paths, OS integration
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
directories = "6.0.0"
interprocess = "2.4.5"
rfd = "0.17.2"
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Tests and benchmarks only
proptest = "1.12.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Noisy pedantic lints we allow on purpose go here, each with a one-line reason.

# Hard rules (Section 8 of PROJECT_BRIEF.md). Tests may opt out via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
indexing_slicing = "deny"
as_conversions = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind" # required: worker threads use catch_unwind

# Optimize dependencies in dev builds so image decoding isn't painfully slow while developing.
[profile.dev.package."*"]
opt-level = 2
